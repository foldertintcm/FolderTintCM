[package]
name = "foldertintcm-menu"
version = "0.3.0"
edition = "2024"
description = "FolderTintCM's Explorer menu for the Microsoft Store package"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "foldertintcm_menu"
crate-type = ["cdylib"]

# The same single dependency as the program. windows: MIT OR Apache-2.0.
[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
]

# The #[implement] macro for the COM classes; already part of windows.
[dependencies.windows-core]
version = "0.62.2"
