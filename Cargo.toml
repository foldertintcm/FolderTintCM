[package]
name = "foldertintcm"
version = "0.3.0"
edition = "2024"
description = "FolderTintCM — colour folders from Explorer's context menu"
license = "GPL-3.0-or-later"
publish = false

# One dependency, on purpose, as in ScreenShotCM: the folder customisation,
# the registry and the dialogs are reached directly through Windows, and the
# icons (drawing, PNG and ICO encoding) are plain Rust in this crate.
# windows: MIT OR Apache-2.0.
[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # Tests only: decoding the PNGs we write with Windows' own decoder (WIC).
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# Every command is one short call into the shell; there is nothing to
# recover from by unwinding.
panic = "abort"
